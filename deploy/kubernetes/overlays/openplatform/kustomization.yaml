apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: review-assistant
resources:
  - ../../base
images:
  - name: ghcr.io/os-autoinst/review-assistant
    newName: ghcr.io/os-autoinst/review-assistant
    newTag: latest
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: review-assistant
