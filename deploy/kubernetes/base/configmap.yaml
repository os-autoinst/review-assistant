apiVersion: v1
kind: ConfigMap
metadata:
  name: review-assistant-config
data:
  reviewer.yaml: |
    agent_name: os-autoinst-review
    skill:
      repo: https://github.com/os-autoinst/openQA-skill.git
      sha: a6d255abcbce67a380f6716c94e861869ed64882
    provider: google-vertex
    model: google/gemini-3.8-flash
    toolsets: file
    pilot_cap: 10
  hermes-config.yaml: |
    vertex:
      project_id: REPLACE_WITH_GCP_PROJECT_ID
      region: global
